[pytest]
# `pytest` with no arguments runs the host-side unit suites (no vcan, no built
# firmware needed). The system suite that drives the two-ECU network on vcan is
# run explicitly inside the dev container: `python3 -m pytest tests -v`, or
# tools/run-system-tests.sh.
testpaths = can gateway host
junit_family = xunit2
junit_logging = system-out
# pytest-timeout: no test of either suite legitimately runs this long.
timeout = 300
