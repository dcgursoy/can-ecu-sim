# picolibc would otherwise hand all remaining SRAM to malloc at boot
# (COMMON_LIBC_MALLOC_ARENA_SIZE=-1). With 0 there is no C/C++ runtime heap:
# malloc returns NULL, so a stray operator new cannot silently succeed.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=0

# Cortex-M4F: use the hardware FPU for the sensor model and controller math.
# FPU_SHARING saves the FP registers on context switch (lazy stacking) because
# more than one thread uses floating point.
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# The STM32 IWDG driver otherwise installs CONFIG_IWDG_STM32_INITIAL_TIMEOUT
# (100 ms) and starts the IWDG at POST_KERNEL. The driver is single-channel and
# would reject the application's later wdt_install_timeout() with -ENOMEM, so
# app::start() would fail and the unfed 100 ms IWDG would reset the part
# forever. Keep the IWDG off until hal::Watchdog::init() arms it at
# CONFIG_APP_WATCHDOG_TIMEOUT_MS. (Board conf, not prj.conf: native_sim has no
# HAS_WDT_DISABLE_AT_BOOT and would reject the symbol.)
CONFIG_WDT_DISABLE_AT_BOOT=y
