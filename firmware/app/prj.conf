# --- Language -------------------------------------------------------------------
CONFIG_CPP=y
CONFIG_STD_CPP17=y
# Zephyr's minimal C++ library has no STL headers (<array>, <optional>, ...), so
# link the full libstdc++ (on the Nucleo this also selects picolibc as the C
# library). Only header-only facilities are used; exceptions and RTTI stay off
# (Zephyr default). The C/C++ runtime heap is closed per board, see boards/*.conf.
CONFIG_REQUIRES_FULL_LIBCPP=y

# --- No kernel heap: k_malloc is not even compiled with a zero-sized pool -----------
CONFIG_HEAP_MEM_POOL_SIZE=0

# --- Timing ---------------------------------------------------------------------
# Same tick rate on both targets. native_sim would otherwise default to 100 Hz,
# which rounds every relative timeout up to 10 ms steps.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000

# --- CAN ------------------------------------------------------------------------
CONFIG_CAN=y
# Bus-off recovery is a decision of the application (backoff, attempt limit,
# FAULT state), not of the peripheral's automatic ABOM mode.
CONFIG_CAN_MANUAL_RECOVERY_MODE=y

# --- Watchdog -------------------------------------------------------------------
CONFIG_WATCHDOG=y
CONFIG_REBOOT=y

# --- Shell (diagnostics: `ecu status`, `ecu reset`) -------------------------------
CONFIG_SHELL=y
CONFIG_SHELL_PROMPT_UART="ecu:~$ "
CONFIG_SHELL_VT100_COLORS=n
CONFIG_SHELL_STACK_SIZE=3072
# Command history allocates from a k_heap on every command; the only run-time
# allocation in the image, so it is switched off (see src/alloc_guard.c).
CONFIG_SHELL_HISTORY=n
CONFIG_SHELL_WILDCARD=n

# --- Diagnostics ----------------------------------------------------------------
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_THREAD_NAME=y
CONFIG_MAIN_STACK_SIZE=2048
