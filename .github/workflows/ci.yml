name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# A push that supersedes a running build cancels it; pull requests likewise.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The checkout on GitHub runners is owned by uid 1001; run as root inside the
  # container so builds can write to the bind-mounted workspace.
  CAN_ECU_SIM_DOCKER_ARGS: --user root

jobs:
  # One job builds the dev-container image (layer-cached between runs) and then
  # runs every build and test step inside it through tools/dev.sh, exactly like a
  # local run. The GitHub-hosted runner's kernel provides the vcan module; the
  # container only needs CAP_NET_ADMIN to create interfaces in its own namespace.
  build-and-test:
    name: Dev image, generated code, host tests, firmware builds, Rust port, network on vcan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The repository is developed on Windows, where the working tree cannot
      # carry the executable bit; it must be set in the index (git add --chmod=+x).
      - name: Shell scripts are committed executable
        run: |
          bad=$(git ls-files -s -- '*.sh' | awk '$1 != "100755" {print $4}')
          if [ -n "$bad" ]; then
            echo "not executable in the git index (fix: git update-index --chmod=+x <file>):"
            echo "$bad"
            exit 1
          fi

      # Host-side precondition for every vcan step below; checked first so a
      # runner image without the module fails in seconds, not after the builds.
      - name: Load vcan module on the runner kernel
        run: |
          sudo modprobe vcan
          sudo modprobe can-gw || true
          lsmod | grep -E '^(vcan|can) '

      - name: Set image name (GHCR requires a lowercase path)
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/dev" >> "$GITHUB_ENV"
          echo "CAN_ECU_SIM_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/dev:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build dev container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push dev container image to GHCR
        if: github.event_name != 'pull_request'
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          # Only main moves the "latest" tag; a workflow_dispatch from a branch does not.
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            docker push "$IMAGE:latest"
          fi

      - name: Tool versions
        run: tools/dev.sh tools/print-versions.sh

      - name: Generated code matches can/network.dbc
        run: tools/dev.sh tools/gen-all.sh --check

      - name: Python unit tests, reference implementation, gateway fault engine, host tools
        run: tools/dev.sh python3 -m pytest -q can/ gateway/ host/ --junitxml=build/test-results/unit-tests.xml

      - name: Host unit tests with coverage (protocol + ecu_core libraries)
        run: tools/dev.sh tools/run-host-tests.sh build/host-tests

      - name: Build firmware, native_sim, both roles
        run: |
          tools/dev.sh tools/build-ecu.sh native_sim sensor -p always
          tools/dev.sh tools/build-ecu.sh native_sim controller -p always

      - name: Build firmware, nucleo_f446re, both roles
        run: |
          tools/dev.sh tools/build-ecu.sh nucleo_f446re sensor -p always
          tools/dev.sh tools/build-ecu.sh nucleo_f446re controller -p always

      - name: No dynamic allocation after init (all four images)
        run: |
          for d in native_sim_sensor native_sim_controller nucleo_f446re_sensor nucleo_f446re_controller; do
            tools/dev.sh tools/check-no-heap.sh "build/$d"
          done

      # clang-tidy and cppcheck over the application sources as both native_sim
      # builds compile them and over the library headers through the host unit
      # tests; every finding is an error (.clang-tidy, tools/static-analysis.sh).
      - name: Static analysis, clang-tidy and cppcheck, every finding an error
        run: tools/dev.sh tools/static-analysis.sh

      # The Rust sensor ECU (rust/): rustfmt and clippy with every warning an
      # error, the unit tests of both crates and the conformance tests of the
      # no_std core against the cantools / e2e_ref.py vectors, the release build
      # of the SocketCAN adapter, and the core cross-compiled for
      # thumbv7em-none-eabihf (the Nucleo's Cortex-M4F), the proof that it
      # carries nothing of std (tools/build-rust.sh).
      - name: Rust sensor ECU, lint, tests, release build, cross-compile for thumbv7em-none-eabihf
        run: tools/dev.sh tools/build-rust.sh

      - name: Smoke test, candump sees protected frames on vcan0
        run: tools/dev.sh tools/smoke-test.sh build/native_sim_sensor/zephyr/zephyr.exe

      # The demos are desktop processes on a shared runner: a run with a detected
      # host stall is INCONCLUSIVE and repeated (up to two retries), a run with
      # a failed criterion and no stall is a real failure.
      - name: Two-ECU network on vcan, all messages verified
        run: tools/dev.sh python3 tools/ecu_network.py --retries 2 run --duration 3

      - name: Safe-state entry and recovery when the sensor dies
        run: tools/dev.sh python3 tools/ecu_network.py --retries 2 safe-state

      - name: Error-passive and bus-off recovery through the HAL test hook
        run: tools/dev.sh python3 tools/ecu_network.py --retries 2 bus-off

      - name: Fault-injection scenarios through the gateway (vcan0 <-> vcan1) and the firmware hooks
        run: tools/dev.sh python3 tools/fault_scenarios.py --retries 2

      - name: Host tools on vcan, logger, live decoder and echo probes, analysis of the recording
        run: tools/dev.sh python3 tools/record_and_analyze.py --retries 2

      # The pytest system suite (tests/): the seven test groups against both ECUs
      # on vcan through the gateway, every measured value logged next to its
      # verdict, run on gcov-instrumented firmware builds so the line coverage of
      # the kernel-dependent firmware code under the suite is reported as well.
      - name: System test suite on vcan (pytest, seven groups) with firmware coverage
        run: tools/dev.sh tools/run-system-tests.sh --coverage

      # Cross-language conformance: the same suite, unchanged, with the Rust
      # sensor ECU in the sensor's place and the C++ controller opposite it.
      # Its results go to their own directory and artifact, so both runs are kept.
      - name: System test suite against the Rust sensor ECU (cross-language conformance)
        run: tools/dev.sh tools/run-system-tests.sh --results build/test-results-rust --sensor-exe rust/target/release/sensor-vcan

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-builds
          path: |
            build/native_sim_*/zephyr/zephyr.exe
            build/nucleo_f446re_*/zephyr/zephyr.elf
            build/nucleo_f446re_*/zephyr/zephyr.hex
            build/*/zephyr/.config
            rust/target/release/sensor-vcan
          include-hidden-files: true
          if-no-files-found: warn

      - name: Upload host unit test report and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-tests
          path: |
            build/host-tests/coverage*
            build/host-tests/host-tests.xml
          if-no-files-found: warn

      - name: Upload static analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis
          path: build/static-analysis/
          if-no-files-found: warn

      - name: Upload network logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-logs
          path: build/network-logs/
          if-no-files-found: warn

      - name: Upload test results (JUnit of every suite, measurements, logs, firmware coverage)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test-results/
          if-no-files-found: warn

      - name: Upload test results of the run against the Rust sensor ECU
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-rust
          path: build/test-results-rust/
          if-no-files-found: warn

      # The run page gets the numbers: test counts of every suite, the coverage
      # figures, the static-analysis verdict and the suite's measured values.
      - name: Job summary
        if: always()
        run: tools/ci-summary.py >> "$GITHUB_STEP_SUMMARY"
