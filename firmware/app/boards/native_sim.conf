# Simulator only: process log messages synchronously in the caller's context so
# the output order matches execution exactly. Not used on hardware, where
# immediate mode would turn every log call into a multi-millisecond blocking UART
# write, including inside CAN RX callbacks.
CONFIG_LOG_MODE_IMMEDIATE=y

# Shell and log on the process's stdin/stdout instead of a pseudo terminal, so
# test scripts can drive the shell through a pipe.
CONFIG_UART_NATIVE_PTY_0_ON_STDINOUT=y

# Watchdog: a counter-based watchdog over the simulator's counter device
# (boards/native_sim.overlay), behind the same Zephyr API as the IWDG.
CONFIG_COUNTER=y
# Expiry must restart the process, not just end it: WDT_FLAG_RESET_SOC makes
# the counter watchdog call sys_arch_reboot(), which on native_sim exits and
# re-executes the same executable with the same arguments only when this option
# is set; without it Zephyr's weak default prints a warning and exits.
CONFIG_NATIVE_SIM_REBOOT=y
